# Ora2Pg configuration for the SQL Server -> PostgreSQL + tsql_compat demo.
# Host names are the container names on the demo network.

# Source: SQL Server (demo-mssql container)
ORACLE_DSN	dbi:ODBC:driver=msodbcsql18;server=demo-mssql,1433;database=shop;TrustServerCertificate=yes
ORACLE_USER	sa
ORACLE_PWD	Tsql_Demo#2026
SCHEMA	dbo
EXPORT_SCHEMA	1
CLIENT_ENCODING	UTF8

# Target: PostgreSQL 17 + tsql_compat (demo-pg container), used for the
# direct data migration (-t COPY) and data validation
PG_DSN	dbi:Pg:dbname=shop;host=demo-pg;port=5432
PG_USER	postgres
PG_PWD	postgres
PG_VERSION	17
FORCE_OWNER	postgres

# Keep the SQL Server types and functions provided by tsql_compat
USE_TSQL_COMPAT	1

# Data migration: foreign keys are dropped during the load and recreated
DROP_FKEY	1
TRUNCATE_TABLE	1

OUTPUT_DIR	/work/output
FILE_PER_FUNCTION	0
STOP_ON_ERROR	1
