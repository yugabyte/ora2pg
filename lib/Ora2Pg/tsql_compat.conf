# Types and functions provided by the tsql_compat PostgreSQL extension.
#
# Ora2Pg reads this file when USE_TSQL_COMPAT is enabled. Use the
# TSQL_COMPAT_FILE directive to read another file instead. Supporting a new
# type or function of the extension only requires a new line here.
#
# Lines are made of fields separated by spaces or tabs, keywords are case
# insensitive, empty lines and text following a # are ignored.
#
# TYPE <SQL Server type> <tsql_compat type> <data format> [modifier]
#
#   The SQL Server type is exported as the tsql_compat type. The data format
#   is the PostgreSQL type with the same input format, it tells how to
#   format the values during data export (bytea is exported in the 0x
#   hexadecimal notation of the tsql_compat binary types). The optional
#   modifier tells what is appended to the type:
#     length     the column length, ex: sys.nvarchar(50)
#     precision  the fractional seconds precision when lower than 7,
#                ex: sys.datetime2(3)
#
# FUNCTION <name> [flag ...]
#
#   Calls to the function are kept as is: Ora2Pg does not rewrite them and
#   does not count them in the migration assessment. The optional flags are:
#     datepart   the first argument is a datepart keyword (see DATEPART
#                below), it is quoted as the extension takes it as text
#     qualify    calls are prefixed with sys., for function names that are
#                grammar in PostgreSQL and would not resolve to the
#                extension through the search_path (ex: TRIM)
#
# DATEPART <keyword> ...
#
#   Datepart keywords quoted in the first argument of the datepart
#   functions. Can be given on several lines.

# NCHAR is not listed because sys.nchar is a domain over bpchar that can not
# take a length.
TYPE	TINYINT			sys.tinyint		smallint
TYPE	BIT			sys.bit			smallint
TYPE	MONEY			sys.money		numeric
TYPE	SMALLMONEY		sys.smallmoney		numeric
TYPE	SMALLDATETIME		sys.smalldatetime	timestamp
TYPE	DATETIME		sys.datetime		timestamp
TYPE	DATETIME2		sys.datetime2		timestamp	precision
TYPE	DATETIMEOFFSET		sys.datetimeoffset	timestamptz	precision
TYPE	NVARCHAR		sys.nvarchar		varchar		length
TYPE	NTEXT			sys.ntext		text
TYPE	VARBINARY		sys.varbinary		bytea		length
TYPE	BINARY			sys.binary		bytea		length
TYPE	IMAGE			sys.image		bytea
TYPE	UNIQUEIDENTIFIER	sys.uniqueidentifier	uuid
TYPE	SYSNAME			sys.sysname		varchar

